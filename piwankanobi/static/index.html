<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f7">
  <title>PiWanKanobi · 이미지와 대화하기</title>
  <link rel="stylesheet" href="./static/app.css">
  <script src="./static/app.js" defer></script>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="PiWanKanobi 처음으로">
        <span class="brand-mark" aria-hidden="true">π</span>
        <span>PiWanKanobi<span class="brand-caption">작은 파이의 시선</span></span>
      </a>
      <div class="header-actions">
        <a class="api-link" href="./api/help" target="_blank" rel="noopener">API 안내 <span aria-hidden="true">↗</span></a>
        <button class="button subtle" id="reset-button" type="button"><span aria-hidden="true">＋</span> 새 대화</button>
      </div>
    </header>

    <main class="chat-layout">
      <div class="model-bar">
        <span class="model-name" id="model-name">Qwen3-VL-2B</span>
        <span class="status" id="status" data-state="loading"><span class="status-dot" aria-hidden="true"></span><span id="status-text" role="status">모델을 확인하는 중</span></span>
      </div>

      <section class="conversation" id="conversation" aria-label="이미지 채팅">
        <div class="welcome" id="welcome">
          <div class="welcome-mark" aria-hidden="true"><span>π</span><i></i></div>
          <p class="eyebrow">A LITTLE PI. A NEW PERSPECTIVE.</p>
          <h1>이미지를 보고,<br>이야기를 나눠보세요.</h1>
          <p class="welcome-description">사진 한 장에서 시작하는 대화.<br>궁금한 장면, 색깔, 글자를 물어보세요.</p>
          <button class="sample-card" id="sample-button" type="button">
            <span class="sample-image"><img src="./samples/apple.png" alt="사과 예제" width="64" height="64"></span>
            <span><strong>사과 이미지로 시작하기</strong><span>사진 없이도 바로 체험해 보세요</span></span>
            <span class="sample-arrow" aria-hidden="true">↗</span>
          </button>
          <div class="suggestions" aria-label="추천 질문">
            <button type="button" data-prompt="이 이미지에 무엇이 보이나요?">무엇이 보이나요?</button>
            <button type="button" data-prompt="이미지의 색과 특징을 설명해 주세요.">색과 특징 알려주기</button>
          </div>
        </div>
        <div class="messages" id="messages" role="log" aria-label="대화 내용" aria-live="polite" aria-relevant="additions"></div>
      </section>

      <div class="composer-area">
        <p class="notice" id="notice" role="status" hidden></p>
        <p class="error-message" id="error-message" role="alert" hidden></p>
        <form class="composer" id="chat-form">
          <div class="attachment" id="attachment" hidden>
            <img id="attachment-image" alt="첨부할 이미지">
            <span><strong id="attachment-name"></strong><span>이 대화에서 함께 볼 이미지</span></span>
            <button id="remove-image" class="icon-button" type="button" aria-label="첨부 이미지 삭제">×</button>
          </div>
          <label class="sr-only" for="prompt">이미지에 대해 물어보세요</label>
          <textarea id="prompt" name="prompt" rows="1" maxlength="6000" placeholder="이미지를 넣고, 궁금한 것을 물어보세요" required></textarea>
          <div class="composer-tools">
            <button class="attach-button" id="attach-button" type="button" title="이미지 선택 또는 여기에 끌어놓기">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.3" cy="8.3" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg>
              이미지 추가
            </button>
            <span class="composer-hint">끌어놓기 · 붙여넣기</span>
            <button class="send-button" id="send-button" type="submit" aria-label="메시지 보내기" disabled>
              <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            </button>
          </div>
          <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp" hidden>
        </form>
        <p class="footnote"><span>Pi에서 직접 실행되는 이미지 채팅</span><span class="footnote-separator">·</span><span>답변이 정확하지 않을 수 있어요</span></p>
      </div>
    </main>
    <div class="drop-overlay" id="drop-overlay" hidden><div><span aria-hidden="true">＋</span><strong>이미지를 여기에 놓아주세요</strong><p>PNG, JPG, WebP · 최대 8 MB</p></div></div>
  </div>
</body>
</html>
